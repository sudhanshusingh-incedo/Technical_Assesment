# docker compose up --build                     -> Qdrant + ingestion job + API (:8000) + UI (:8501)
# docker compose --profile ollama up --build    -> additionally a local Ollama LLM (fallback / no API key)

name: knowledge-assistant

x-app: &app
  build: .
  image: knowledge-assistant:latest
  env_file:
    - path: .env
      required: false
  environment:
    QDRANT_URL: http://qdrant:6333
    OLLAMA_BASE_URL: http://ollama:11434

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"   # REST + dashboard (http://localhost:6333/dashboard); remove in production
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot, idempotent: unchanged documents are skipped on every restart.
  ingest:
    <<: *app
    command: ["python", "-m", "kassist.ingestion"]
    volumes:
      # The corpus is mounted (read-only), so adding/changing/removing a PDF in ./data/corpus and running
      # `docker compose run --rm ingest` re-indexes incrementally without rebuilding the image.
      - ./data/corpus:/app/data/corpus:ro
      - parse_cache:/app/data/.parse_cache
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "kassist.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      CONVERSATION_DB_PATH: /app/state/conversations.sqlite   # conversation history survives restarts
    volumes:
      - app_state:/app/state
    ports:
      - "8000:8000"
    depends_on:
      ingest:
        condition: service_completed_successfully
    restart: unless-stopped

  ui:
    <<: *app
    command: ["streamlit", "run", "/app/ui/streamlit_app.py", "--server.port=8501",
              "--server.address=0.0.0.0", "--browser.gatherUsageStats=false"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.1
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.40.1
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:7b-instruct"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  qdrant_data:
  app_state:
  parse_cache:
  ollama_models:
