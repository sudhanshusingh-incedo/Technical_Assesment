name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit + API tests (fake models, in-memory Qdrant; no network or API keys)
        run: pytest --cov=kassist --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t knowledge-assistant:ci .
