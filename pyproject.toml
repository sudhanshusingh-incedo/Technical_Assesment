[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kassist"
version = "0.1.0"
description = "Intelligent Knowledge Assistant: hybrid RAG + LangGraph agentic workflow over a PDF corpus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings[yaml]>=2.4",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "pymupdf>=1.26",
    "pymupdf4llm>=0.0.27",
    "qdrant-client[fastembed]>=1.12",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "slowapi>=0.1.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "matplotlib>=3.8"]  # matplotlib: docs diagrams only

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests against a running stack (deselect with -m 'not e2e')",
    "slow: tests that load real ONNX models or parse the real corpus",
]
addopts = "-ra -m 'not e2e'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "B008"]  # asserts in tests; FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/kassist/llm/prompts.py" = ["E501"]  # prompt text: wrapping would change what the model sees
