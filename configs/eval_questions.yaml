# Evaluation set. Gold sources were labelled by hand from the corpus PDFs.
#
# Fields
#   category:        simple | multi_step | tool_use | follow_up | ambiguous | unanswerable | partial | out_of_scope | adversarial
#   history:         (follow_up only) earlier turns of the conversation, oldest first
#   expected_route:  routes considered correct (the router may legitimately pick either for borderline cases)
#   expected_status: statuses considered correct
#   gold:            (doc_id, page) pairs that contain the answer; used for retrieval metrics + citation checks
#   key_facts:       facts the answer must contain; a nested list means "any of these spellings"
#   should_decline:  the system must NOT produce an answer (no hallucination allowed)

questions:
  - id: S1
    category: simple
    question: What chunk size and overlap does the RAG reference recommend for RecursiveCharacterTextSplitter?
    expected_route: [simple]
    expected_status: [answered]
    gold: [[rag_architecture_patterns, 4]]
    key_facts: ["512", "64"]

  - id: S2
    category: simple
    question: What value of k is used in Reciprocal Rank Fusion?
    expected_route: [simple]
    expected_status: [answered]
    gold: [[rag_architecture_patterns, 6]]
    key_facts: ["60"]

  - id: S3
    category: simple
    question: What recall@10 does pgvector HNSW achieve at 1M vectors?
    expected_route: [simple]
    expected_status: [answered]
    gold: [[vector_database_comparison, 5]]
    key_facts: ["96.1"]

  - id: S4
    category: simple
    question: Which storage backends does LangGraph support for checkpointing?
    expected_route: [simple]
    expected_status: [answered]
    gold: [[agentic_ai_frameworks, 2], [agentic_ai_frameworks, 5]]
    key_facts: ["SQLite", "Postgre", "Redis"]

  - id: S5
    category: simple
    question: How much does text-embedding-3-small cost and what is its MTEB score?
    expected_route: [simple, agentic]
    expected_status: [answered]
    gold: [[rag_architecture_patterns, 4], [rag_architecture_patterns, 5]]
    key_facts: ["62.3", ["0.02", "0.00002"]]

  - id: S6
    category: simple
    question: What faithfulness score should a high-quality RAG system target?
    expected_route: [simple]
    expected_status: [answered]
    gold: [[rag_architecture_patterns, 9]]
    key_facts: [["0.90", "0.9", "90%"]]

  - id: M1
    category: multi_step
    question: Which vector database suits a cost-conscious startup that needs both hybrid search and ACID compliance?
    expected_route: [agentic]
    expected_status: [answered, partial]
    gold: [[vector_database_comparison, 4], [vector_database_comparison, 6]]
    key_facts: ["pgvector", "ACID"]

  - id: M2
    category: multi_step
    question: Compare Pinecone, Weaviate and pgvector for a production RAG system in terms of hybrid search, metadata filtering and scale.
    expected_route: [agentic]
    expected_status: [answered, partial]
    gold: [[vector_database_comparison, 3], [vector_database_comparison, 4], [rag_architecture_patterns, 8]]
    key_facts: ["Pinecone", "Weaviate", "pgvector", ["pod", "Pod"]]

  - id: M3
    category: multi_step
    question: What security considerations should I address when deploying a RAG system at scale?
    expected_route: [agentic, simple]
    expected_status: [answered, partial]
    gold: [[rag_architecture_patterns, 7], [rag_architecture_patterns, 10], [agentic_ai_frameworks, 7]]
    key_facts: [["prompt injection", "Prompt injection"], ["tenant", "access control"], ["PII"]]

  - id: M4
    category: multi_step
    question: Which agent framework does the corpus recommend for a production RAG knowledge assistant, and why not CrewAI?
    expected_route: [agentic]
    expected_status: [answered, partial]
    gold: [[agentic_ai_frameworks, 6], [agentic_ai_frameworks, 2], [agentic_ai_frameworks, 3]]
    key_facts: ["LangGraph", ["checkpoint", "explicit state", "state"]]

  - id: T1
    category: tool_use
    question: How much float32 storage would 10 million text-embedding-3-large vectors need, and how much with int8 quantisation?
    expected_route: [agentic]
    expected_status: [answered, partial]
    gold: [[rag_architecture_patterns, 5]]
    key_facts: [["122.9", "122.88", "123", "~120", "120 GB"], ["30.7", "30.72", "31", "~30", "30 GB"]]

  - id: F1
    category: follow_up
    history:
      - question: Which vector database offers full ACID compliance?
        answer: pgvector is the only option with full ACID compliance, because it runs inside PostgreSQL.
    question: What recall@10 does it achieve at 1M vectors?
    expected_route: [simple, agentic]
    expected_status: [answered]
    gold: [[vector_database_comparison, 5]]
    key_facts: ["96.1"]
    notes: '"it" must be resolved to pgvector from the conversation before retrieval.'

  - id: A1
    category: ambiguous
    question: Which one is best?
    expected_route: [clarify]
    expected_status: [clarification_needed]
    gold: []
    key_facts: []

  - id: A2
    category: ambiguous
    question: How does hybrid work?
    expected_route: [simple, agentic]
    expected_status: [answered, partial]
    gold: [[rag_architecture_patterns, 5], [rag_architecture_patterns, 6], [vector_database_comparison, 3]]
    key_facts: [["BM25", "sparse"], ["RRF", "Reciprocal Rank Fusion"]]

  - id: U1
    category: unanswerable
    question: What index types does Milvus support?
